project_id = "jalonis"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "https://jalonis.onrender.com"
additional_redirect_urls = ["https://jalonis.onrender.com", "https://jalonis.onrender.com/**", "http://localhost:5173", "http://127.0.0.1:5173", "http://127.0.0.1:4173", "http://127.0.0.1:4174"]

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.invite-member]
verify_jwt = true

[functions.create-workspace]
verify_jwt = true

[functions.create-billing-checkout]
verify_jwt = true

[functions.project-assistant]
verify_jwt = false

[functions.process-email-queue]
verify_jwt = false

[functions.process-whatsapp-queue]
verify_jwt = false

[functions.flutterwave-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false
