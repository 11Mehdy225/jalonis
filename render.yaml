services:
  - type: web
    runtime: static
    name: jalonis
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPPORT_EMAIL
        value: contact@ronnagroup.net
      - key: VITE_SITE_URL
        value: https://jalonis.ronnagroup.net
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-pZzydcQ3Rx8pUyMTf9z3hdZ1arktiNdm4Yh3vGA/TJs='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
